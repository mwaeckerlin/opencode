# End-to-end stack of tests/run-e2e.sh: a real LiteLLM with a mock model that
# demands its master key, a real Hindsight that demands its tenant key, the
# gateway that holds both keys, and the sandbox that holds none; the same
# sandbox below the base path /opencode behind Traefik, and at the root with
# the login link, the alert relay and a subscription model whose simulated
# OpenAI refuses its expired login; a real Alertmanager and a real Grafana
# that send alerts; Chromium and Firefox. The keys, the passwords and the
# alert token are test values of this stack only.
name: opencode-e2e

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/etc/litellm.yaml", "--port", "4000"]
    configs:
      - source: litellm
        target: /etc/litellm.yaml
    environment:
      LITELLM_MASTER_KEY: e2e-litellm-key-of-the-test-stack
    networks:
      - services

  # OpenAI, which no container can run, as it answers a subscription whose
  # login expired and a request it refuses
  openai-simulated:
    image: mwaeckerlin/opencode:gateway
    entrypoint: ["/usr/bin/node", "/etc/openai-simulated.cjs"]
    configs:
      - source: openai-simulated
        target: /etc/openai-simulated.cjs
    networks:
      - services

  hindsight:
    image: mwaeckerlin/hindsight
    environment:
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_API_LLM_PROVIDER: mock
      HINDSIGHT_API_LLM_MODEL: mock-model
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY_FILE: /run/secrets/hindsight_key
    secrets:
      - hindsight_key
    networks:
      - services

  opencode-gateway:
    image: mwaeckerlin/opencode:gateway
    environment:
      LITELLM_URL: http://litellm:4000
      HINDSIGHT_URL: http://hindsight:8888
      LITELLM_API_KEY_FILE: /run/secrets/litellm_key
      HINDSIGHT_API_KEY_FILE: /run/secrets/hindsight_key
    secrets:
      - litellm_key
      - hindsight_key
    networks:
      - sandbox
      - services

  opencode-sandbox:
    image: mwaeckerlin/opencode:sandbox
    environment:
      OPENCODE_GATEWAY_URL: http://opencode-gateway:8080
      OPENCODE_MODELS: test-model
      HINDSIGHT_SHARED_BANK: shared
      HINDSIGHT_OWN_BANK: opencode
      OPENCODE_SERVER_PASSWORD_FILE: /run/secrets/server_password
    secrets:
      - server_password
    networks:
      - sandbox
      - delegation
      - web

  # the same image below the base path /opencode, the way the deployment runs
  # it behind the proxy, with the login link on the origin of the proxy and the
  # alert relay
  opencode-base-path:
    image: mwaeckerlin/opencode:sandbox
    environment:
      OPENCODE_GATEWAY_URL: http://opencode-gateway:8080
      OPENCODE_MODELS: test-model
      OPENCODE_BASE_PATH: /opencode
      OPENCODE_SERVER_PASSWORD_FILE: /run/secrets/server_password
      LITELLM_SUBSCRIPTION_LOGIN_URL: http://proxy:8080/litellm/mysubs
      OPENCODE_ALERT_TOKEN_SHA256: ${OPENCODE_E2E_ALERT_TOKEN_SHA256}
    secrets:
      - server_password
    networks:
      - sandbox
      - web

  # the same image at the root with the login link, the alert relay and the
  # plugin; mysubs/test-model fails the way a subscription model fails
  opencode-subscription:
    image: mwaeckerlin/opencode:sandbox
    environment:
      OPENCODE_GATEWAY_URL: http://opencode-gateway:8080
      OPENCODE_MODELS: test-model,mysubs/test-model,broken-model
      OPENCODE_SERVER_PASSWORD_FILE: /run/secrets/server_password
      LITELLM_SUBSCRIPTION_LOGIN_URL: http://proxy:8080/litellm/mysubs
      OPENCODE_ALERT_TOKEN_SHA256: ${OPENCODE_E2E_ALERT_TOKEN_SHA256}
    secrets:
      - server_password
    networks:
      - sandbox
      - web
      - alerting

  # a sender of webhooks and of requests to Alertmanager and Grafana, on their
  # network; it holds the alert token, which the sandbox never sees
  alert-sender:
    image: mwaeckerlin/opencode:sandbox
    entrypoint: ["/usr/bin/curl"]
    command: ["--version"]
    networks:
      - alerting

  # Alertmanager sends every alert to the relay with the token from its file
  alertmanager:
    image: prom/alertmanager:latest
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    configs:
      - source: alertmanager
        target: /etc/alertmanager/alertmanager.yml
    secrets:
      - alert_token
    networks:
      - alerting

  # Grafana tests a webhook contact point against the relay
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${OPENCODE_E2E_GRAFANA_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    networks:
      - alerting

  # Traefik with the route of the deployment: PathPrefix(`/opencode`), no StripPrefix
  proxy:
    build: proxy
    image: mwaeckerlin/opencode-e2e-proxy
    user: "65534:65534"
    networks:
      - web

  # Chromium through the proxy below /opencode, and at the root without a base path
  browser:
    build: browser
    image: mwaeckerlin/opencode-e2e-browser
    environment:
      PROXY_URL: http://proxy:8080
      PREFIX: /opencode
      ROOT_URL: http://opencode-sandbox:4096
      SUBSCRIPTION_URL: http://opencode-subscription:4096
      LOGIN_URL: http://proxy:8080/litellm/mysubs
      OPENCODE_E2E_SERVER_PASSWORD: ${OPENCODE_E2E_SERVER_PASSWORD}
    networks:
      - web

  # an agent that delegates development, as the Hermes and OpenClaw gateways
  # do: it reaches the OpenCode server over a network of its own and attaches
  delegating-agent:
    image: mwaeckerlin/opencode:sandbox
    entrypoint: ["/usr/local/bin/opencode"]
    command: ["--version"]
    environment:
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_MODELS_FETCH: "true"
    networks:
      - delegation

configs:
  litellm:
    content: |
      model_list:
        - model_name: test-model
          litellm_params:
            model: openai/test-model
            api_key: not-used-by-the-mock
            mock_response: "Hello from the mock LiteLLM of the opencode test stack."
        # a subscription model whose login expired: the simulated OpenAI
        # answers 401, and LiteLLM passes on its AuthenticationError
        - model_name: mysubs/test-model
          litellm_params:
            model: openai/test-expired
            api_base: http://openai-simulated:4000/v1
            api_key: sk-of-the-simulated-account
        # a failing model outside the subscriptions: the simulated OpenAI
        # refuses the request with 400
        - model_name: broken-model
          litellm_params:
            model: openai/test-refused
            api_base: http://openai-simulated:4000/v1
            api_key: sk-of-the-simulated-account
      litellm_settings:
        num_retries: 0
      router_settings:
        disable_cooldowns: true
  openai-simulated:
    content: |
      // two answers of OpenAI: to the expired login of a subscription (model
      // test-expired) HTTP 401 with the body the Codex backend sends for an
      // access token it no longer accepts, as reported in
      // https://github.com/openai/codex/issues/18769; to every other model
      // HTTP 400 with type invalid_request_error
      require("http").createServer((request, response) => {
        let body = ""
        request.on("data", (chunk) => (body += chunk))
        request.on("end", () => {
          let model = ""
          try { model = JSON.parse(body).model ?? "" } catch {}
          console.log("REQUEST", request.method, request.url, "model=" + model)
          const expired = model === "test-expired"
          response.writeHead(expired ? 401 : 400, { "content-type": "application/json" })
          response.end(JSON.stringify(expired
            ? { error: { message: "Provided authentication token is expired. Please try signing in again.", type: null, code: "token_expired", param: null }, status: 401 }
            : { error: { message: "The simulated OpenAI of the opencode test stack refuses every request to " + model + ".", type: "invalid_request_error", param: null, code: null } }))
        })
      }).listen(4000)
  alertmanager:
    content: |
      route:
        receiver: opencode
        group_by: [alertname]
        group_wait: 1s
        group_interval: 1s
        repeat_interval: 1h
      receivers:
        - name: opencode
          webhook_configs:
            - url: http://opencode-subscription:4096/alert
              send_resolved: true
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /run/secrets/alert_token

secrets:
  alert_token:
    environment: OPENCODE_E2E_ALERT_TOKEN
  litellm_key:
    environment: OPENCODE_E2E_LITELLM_KEY
  hindsight_key:
    environment: OPENCODE_E2E_HINDSIGHT_KEY
  server_password:
    environment: OPENCODE_E2E_SERVER_PASSWORD

networks:
  sandbox:
    internal: true
  delegation:
    internal: true
  # the proxy, the browser and the three web interfaces, without internet access
  web:
    internal: true
  # the senders of the alerts, Alertmanager, Grafana and the sandbox that takes them
  alerting:
    internal: true
  services:
